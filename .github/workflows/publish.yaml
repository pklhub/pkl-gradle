name: Publish Gradle plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: ./gradlew test
      - name: Publish Maven artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew -Pversion="${GITHUB_REF_NAME#v}" publishPluginMavenPublicationToGitHubPackagesRepository
