name: Publish Gradle plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: ./gradlew test
      - name: Publish to the public Maven repository
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          branch="refs/heads/maven-releases"
          repository="$RUNNER_TEMP/maven-releases"

          existing_branch=$(git ls-remote --heads origin "$branch")
          if [[ -n "$existing_branch" ]]; then
            git fetch origin "$branch"
            git worktree add --detach "$repository" FETCH_HEAD
          else
            git init "$repository"
          fi

          artifact="$repository/com/github/pklhub/pkl-gradle/$version/pkl-gradle-$version.jar"
          if [[ -f "$artifact" ]]; then
            echo "Version $version is already published."
            exit 0
          fi

          ./gradlew -Pversion="$version" -PpublicMavenDirectory="$repository" \
            publishAllPublicationsToPublicMavenRepository
          git -C "$repository" add .
          git -C "$repository" \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Publish pkl-gradle $version"
          git fetch "$repository" HEAD
          git push origin "FETCH_HEAD:$branch"
